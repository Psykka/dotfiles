# Light monochrome palette, the dark one turned around. Colors are hex
# without "#". The wallpaper panel's "Light" uses it on top of the
# palette in use; `theme light` makes it the palette.

# GTK / portals
scheme=prefer-light
gtk_theme=Adwaita
prefer_dark=0
vscode_type=light

# Grays, from the background (lightest) to the text (darkest)
bg0=f6f6f6
bg1=eeeeee
surface=ebebeb
bg2=e2e2e2
line=d4d4d4
faint=bdbdbd
off=a3a3a3
mute=737373
sub=5f5f5f
fg=262626
hi=000000

# Desktop wallpaper (from the wallpapers package)
wallpaper=~/.local/share/wallpapers/moon-earth.jpg

# Bar logo: auto (detects the distro), fedora, ubuntu, debian, redhat,
# centos, opensuse or tux
logo=fedora

# Bar islands (notch)
island=f6f6f6

# Focused border, filled sliders, "Yes" buttons; the light background is the
# text on it
accent=2b2b2b

# Shadow under popups: lighter than on dark, or it reads as a smudge
shadow=0000002e

# Terminal: deep colors, dark enough to read on the light background
black=262626
red=a83d3d
green=3f7a35
yellow=876414
blue=3459a3
magenta=82469a
cyan=26777a
white=c8c8c8
bright_black=6e6e6e
bright_red=c25555
bright_green=56924b
bright_yellow=a07c2a
bright_blue=4c72bd
bright_magenta=9c5fb3
bright_cyan=3a9194
bright_white=a0a0a0
