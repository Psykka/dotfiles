# Light monochrome palette. Colors are hex without "#".

# GTK / portals
scheme=prefer-light
gtk_theme=Adwaita
prefer_dark=0

# Grays, from the base to the strongest text
bg0=f4f4f4
bg1=e6e6e6
surface=ffffff
bg2=ececec
line=dcdcdc
faint=c4c4c4
off=b0b0b0
mute=8a8a8a
sub=707070
fg=2a2a2a
hi=000000

# Focused border, filled sliders, "Yes" buttons
accent=1a1a1a

# Shadow under popups, with alpha
shadow=00000040

# Terminal: desaturated so tools stay readable
black=2a2a2a
red=a04848
green=4f6f4f
yellow=8a7a3e
blue=4a5f80
magenta=6f5a7a
cyan=4f7a7a
white=8a8a8a
bright_black=6a6a6a
bright_red=b85c5c
bright_green=5f805f
bright_yellow=9a8a4e
bright_blue=5a6f90
bright_magenta=7f6a8a
bright_cyan=5f8a8a
bright_white=000000
