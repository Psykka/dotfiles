# Dark monochrome palette. Colors are hex without "#".

# GTK / portals
scheme=prefer-dark
gtk_theme=Adwaita-dark
prefer_dark=1

# Grays, darkest to lightest
bg0=121212
bg1=181818
surface=1a1a1a
bg2=222222
line=2c2c2c
faint=444444
off=555555
mute=777777
sub=8a8a8a
fg=d0d0d0
hi=ffffff

# Desktop wallpaper (from the wallpapers package)
wallpaper=~/.local/share/wallpapers/moon-earth.jpg

# Bar islands (notch), darker than everything else
island=0a0a0a

# Focused border, filled sliders, "Yes" buttons
accent=e8e8e8

# Shadow under popups, with alpha
shadow=000000b0

# Terminal: desaturated so tools stay readable
black=262626
red=b56b6b
green=8fa58f
yellow=b5a77a
blue=7f8fa6
magenta=a08aa6
cyan=8aa6a6
white=d0d0d0
bright_black=555555
bright_red=c98a8a
bright_green=a8bca8
bright_yellow=c9bd95
bright_blue=9aa8bb
bright_magenta=b6a3bb
bright_cyan=a3bbbb
bright_white=ffffff
