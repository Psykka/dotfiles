# Dark monochrome palette. Colors are hex without "#".

# GTK / portals
scheme=prefer-dark
gtk_theme=Adwaita-dark
prefer_dark=1

# Grays, darkest to lightest
bg0=151515
bg1=1b1b1b
surface=1d1d1d
bg2=252525
line=303030
faint=454545
off=555555
mute=777777
sub=8a8a8a
fg=d0d0d0
hi=ffffff

# Desktop wallpaper (from the wallpapers package)
wallpaper=~/.local/share/wallpapers/moon-earth.jpg

# Bar logo: auto (detects the distro), fedora, ubuntu, debian, redhat,
# centos, opensuse or tux
logo=fedora

# Bar islands (notch); light enough to stand out on the wallpaper
island=151515

# Focused border, filled sliders, "Yes" buttons
accent=e8e8e8

# Shadow under popups, with alpha
shadow=000000b0

# Terminal: soft colors, light enough to read on the dark background
black=282828
red=d48282
green=a6c79c
yellow=d6c28c
blue=92aad6
magenta=c2a0d2
cyan=92c6c6
white=d0d0d0
bright_black=555555
bright_red=e8a0a0
bright_green=bfdcb4
bright_yellow=e8d8a6
bright_blue=adc2e8
bright_magenta=d6b8e2
bright_cyan=addada
bright_white=ffffff
