# Dark monochrome palette. Colors are hex without "#".

# GTK / portals
scheme=prefer-dark
gtk_theme=Adwaita-dark
prefer_dark=1

# Grays, darkest to lightest
bg0=151515
bg1=1b1b1b
surface=1d1d1d
bg2=252525
line=303030
faint=454545
off=555555
mute=777777
sub=8a8a8a
fg=d0d0d0
hi=ffffff

# Desktop wallpaper (from the wallpapers package)
wallpaper=~/.local/share/wallpapers/moon-earth.jpg

# Bar islands (notch); light enough to stand out on the wallpaper
island=151515

# Focused border, filled sliders, "Yes" buttons
accent=e8e8e8

# Shadow under popups, with alpha
shadow=000000b0

# Terminal: desaturated so tools stay readable
black=282828
red=b56b6b
green=8fa58f
yellow=b5a77a
blue=7f8fa6
magenta=a08aa6
cyan=8aa6a6
white=d0d0d0
bright_black=555555
bright_red=c98a8a
bright_green=a8bca8
bright_yellow=c9bd95
bright_blue=9aa8bb
bright_magenta=b6a3bb
bright_cyan=a3bbbb
bright_white=ffffff
