[main]
# Adwaita Mono as fallback for the icons (⏻ ↻ ⌨), slightly larger
font=JetBrains Mono:size=11,Adwaita Mono:size=15,Noto Color Emoji:size=11
prompt="❯ "
placeholder=search...
icons-enabled=no
# Fixed size for every menu (launcher, power menu, keybindings)
lines=10
width=64
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=22

[colors]
background=121212ff
text=8a8a8aff
prompt=ffffffff
placeholder=777777ff
input=ffffffff
match=ffffffff
selection=222222ff
selection-text=ffffffff
selection-match=ffffffff
border=e8e8e8ff

[border]
width=2
radius=6
selection-radius=4
