[main]
# Colors come from the palette (`theme`)
include=~/.config/fuzzel/colors.ini
# Font Awesome for the menu icons, Adwaita Mono for ⏻ ↻ ⌨ in older menus
font=JetBrains Mono:size=11,Font Awesome 6 Free:style=Solid:size=11,Font Awesome 6 Brands:size=11,Adwaita Mono:size=15,Noto Color Emoji:size=11
prompt="❯ "
placeholder=search...
# Grayscale app icons, built by make-mono-icons
icons-enabled=yes
icon-theme=Papirus-Mono
# Fixed size for every menu (launcher, power menu, keybindings)
lines=10
width=64
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=22

[border]
width=2
radius=6
selection-radius=4
