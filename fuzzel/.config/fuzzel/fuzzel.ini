[main]
# Colors come from the palette (`theme`)
include=~/.config/fuzzel/colors.ini
# Adwaita Mono as fallback for the icons (⏻ ↻ ⌨), slightly larger
font=JetBrains Mono:size=11,Adwaita Mono:size=15,Noto Color Emoji:size=11
prompt="❯ "
placeholder=search...
icons-enabled=no
# Fixed size for every menu (launcher, power menu, keybindings)
lines=10
width=64
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=22

[border]
width=2
radius=6
selection-radius=4
